<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 512 512">
  <!--
    Apple touch icon: solid orange, square (iOS composites transparency onto
    black and rounds the corners itself, so no rx here).

    Same 512 viewBox and the same arc geometry as scripts/favicon.svg — keep the
    two paths identical so the home-screen icon and the tab icon are one mark.
  -->
  <rect width="512" height="512" fill="#FF7A59"/>
  <path d="M 340.31 162.36 A 126 126 0 1 0 340.31 349.64"
        fill="none" stroke="#FFFFFF" stroke-width="68" stroke-linecap="round"/>
</svg>
