name: Workspace gate probe

on:
  push:
    branches: [docs/cresciva-production-readiness]
    paths: [.github/workflows/workspace-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    if: github.repository == 'paullight1/scaleupafrica'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cresciva-production-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Probe root gates and record exact outcome
        shell: bash
        run: |
          set +e
          result="ALL_PASS"
          if ! npm run lint; then
            result="LINT_FAILED"
          elif ! npm run typecheck; then
            result="TYPECHECK_FAILED"
          elif ! npm run test; then
            result="TEST_FAILED"
          elif ! npm run build; then
            result="BUILD_FAILED"
          elif ! npm run build:api; then
            result="API_BUILD_FAILED"
          fi
          rm -rf .diagnostics/workspace-gate
          mkdir -p .diagnostics/workspace-gate
          printf '%s\n' "$result" > ".diagnostics/workspace-gate/$result"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/workspace-gate
          git commit -m "ci: record workspace gate result ($result)"
          git push origin HEAD:docs/cresciva-production-readiness
