name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install locked dependencies
        run: npm ci

      - name: Verify workspaces
        run: npm run verify

      - name: Typecheck Supabase Edge Functions
        run: |
          deno check \
            supabase/functions/bachs-init/index.ts \
            supabase/functions/bachs-verify/index.ts \
            supabase/functions/bachs-webhook/index.ts \
            supabase/functions/payment-reconciliation/index.ts \
            supabase/functions/account-data/index.ts \
            supabase/functions/aggregate-funding/index.ts \
            supabase/functions/business-enrichment/index.ts \
            supabase/functions/funding-source-refresh/index.ts \
            supabase/functions/funding-notifications/index.ts \
            supabase/functions/send-email/index.ts \
            supabase/functions/email-unsubscribe/index.ts

      - name: Verify production artifacts
        run: |
          test -f Frontend/dist/index.html
          test -f Frontend/dist/admin/index.html
          test -f Backend/dist/Backend/src/main.js

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
