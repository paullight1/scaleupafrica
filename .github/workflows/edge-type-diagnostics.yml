name: Edge type diagnostics

on:
  push:
    branches: [docs/cresciva-production-readiness]

permissions:
  contents: read

jobs:
  deno-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check active Edge Functions individually
        shell: bash
        run: |
          set +e
          status=0
          for file in \
            supabase/functions/bachs-init/index.ts \
            supabase/functions/bachs-verify/index.ts \
            supabase/functions/bachs-webhook/index.ts \
            supabase/functions/payment-reconciliation/index.ts \
            supabase/functions/aggregate-funding/index.ts \
            supabase/functions/send-email/index.ts \
            supabase/functions/email-unsubscribe/index.ts
          do
            echo "=== EDGE CHECK: $file ==="
            deno check "$file"
            code=$?
            echo "=== EXIT $code: $file ==="
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          exit "$status"
